<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LinexTrip">
  <title>LinexTrip</title>
  <!-- Marca reducida para pestaña de navegador: fondo Índigo Texto #00145A y la
       "T" de Trip en Celeste Acción #00B5F5, los dos colores oficiales del
       logotipo. A 16px el wordmark completo es ilegible, así que se reduce a la
       inicial de la sub-marca sobre el fondo permitido (nunca fondo celeste). -->
  <rect width="32" height="32" rx="7" fill="#00145A"/>
  <rect x="7" y="8.8" width="18" height="4.4" rx="1.2" fill="#00B5F5"/>
  <rect x="13.8" y="8.8" width="4.4" height="15" rx="1.2" fill="#00B5F5"/>
</svg>
